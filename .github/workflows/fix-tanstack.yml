
name: Fix TanStack Security

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update secure dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install @tanstack/react-start@^1.168.60 @tanstack/react-router@^1.170.41 @tanstack/router-plugin@^1.168.42

      - name: Verify dependency versions
        run: |
          npm ls @tanstack/react-start @tanstack/start-server-core

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Fix TanStack Start security vulnerability" || echo "No changes to commit"
          git push
